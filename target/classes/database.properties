# Configurações de conexão com o banco de dados
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/estacionamento?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=sua_senha

# Configurações do pool de conexões
pool.maxSize=10
pool.minIdle=5
pool.idleTimeout=30000
pool.connectionTimeout=10000
pool.maxLifetime=1800000

# Configurações adicionais
db.autoReconnect=true
db.useUnicode=true
db.characterEncoding=UTF-8
